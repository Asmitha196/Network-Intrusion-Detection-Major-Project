# =============================================================================
# alembic.ini — Alembic database migration configuration
#
# Usage:
#   # Apply all pending migrations:
#   alembic upgrade head
#
#   # Generate a new auto-detected migration:
#   alembic revision --autogenerate -m "describe_change"
#
#   # Downgrade one step:
#   alembic downgrade -1
#
# The DATABASE_URL is injected from the environment in db/migrations/env.py.
# The sqlalchemy.url value below is a fallback for local CLI use only;
# it is overridden inside env.py via DATABASE_URL from .env.
# =============================================================================

[alembic]
# Path to migration scripts, relative to this file
script_location = db/migrations

# Template used when generating new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the above timestamp
timezone = UTC

# Fallback URL — overridden at runtime by env.py reading DATABASE_URL
# Use the synchronous psycopg2/psycopg URL (not asyncpg) because Alembic runs
# migrations synchronously.
sqlalchemy.url = postgresql://postgres:Akrithi%%401234@localhost:5433/NIDS

# How many characters of the revision hash to use in file names
truncate_slug_length = 40

[post_write_hooks]
# Uncomment to auto-format generated migration files with black:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
